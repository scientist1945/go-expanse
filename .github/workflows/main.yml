name: Build and Release go-expanse

on:
  push:
    tags:
      - 'v*' # Se activa al subir un tag como v1.0.0

permissions:
  contents: write # Necesario para crear el Release y subir los archivos

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Ajusta si tu go.mod requiere otra versión

      - name: Compilar para Linux (amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/gexp-linux-amd64 ./cmd/gexp

      - name: Compilar para Windows (amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/gexp-windows-amd64.exe ./cmd/gexp

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gexp-linux-amd64
            dist/gexp-windows-amd64.exe
          generate_release_notes: true
