name: Build gexp for Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Compilar gexp.exe
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "1"

          # Compatibilidad tanto con go.mod como con estructura legacy GOPATH
          if (-not (Test-Path "go.mod")) {
            $env:GO111MODULE = "off"
            $gopath = "$env:RUNNER_TEMP\gopath"
            $dest = "$gopath\src\github.com\expanse-org\go-expanse"
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item -Recurse -Force . $dest
            $env:GOPATH = $gopath
            Set-Location $dest
          }

          go build -v -o "$env:GITHUB_WORKSPACE\gexp.exe" ./cmd/gexp

      - name: Subir ejecutable compilado
        uses: actions/upload-artifact@v4
        with:
          name: gexp-windows-amd64
          path: gexp.exe
