name: Build Gexp Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout scientist1945/go-expanse
        uses: actions/checkout@v4
        with:
          repository: scientist1945/go-expanse

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Build gexp.exe
        env:
          GO111MODULE: "off"
        run: |
          $gopath = go env GOPATH
          $dest = "$gopath\src\github.com\expanse-org\go-expanse"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path ".\*" -Destination $dest -Recurse -Force
          go build -v -o gexp.exe github.com/expanse-org/go-expanse/cmd/gexp

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: gexp-windows
          path: gexp.exe
