name: Build Gexp Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Get GOPATH
        id: gopath
        run: |
          $gopath = go env GOPATH
          echo "path=$gopath" >> $env:GITHUB_OUTPUT

      - name: Checkout scientist1945/go-expanse
        uses: actions/checkout@v4
        with:
          repository: scientist1945/go-expanse
          path: ${{ steps.gopath.outputs.path }}/src/github.com/expanse-org/go-expanse

      - name: Build gexp.exe
        env:
          GO111MODULE: "off"
        run: |
          go build -v -o gexp.exe github.com/expanse-org/go-expanse/cmd/gexp

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: gexp-windows
          path: gexp.exe
