name: Build Gexp Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Build gexp.exe
        env:
          GO111MODULE: "off"
        run: |
          mkdir -p $env:GOPATH/src/github.com/expanse-org
          cp -r . $env:GOPATH/src/github.com/expanse-org/go-expanse
          go build -v -o gexp.exe github.com/expanse-org/go-expanse/cmd/gexp

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: gexp-windows
          path: gexp.exe
