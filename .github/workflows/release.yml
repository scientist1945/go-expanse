name: Build and Release go-expanse

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar compiladores C/C++ (GCC y MinGW para Windows)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-x86-64

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Compilar para Linux (amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/gexp-linux-amd64 ./cmd/gexp

      - name: Compilar para Windows (amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/gexp-windows-amd64.exe ./cmd/gexp

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gexp-linux-amd64
            dist/gexp-windows-amd64.exe
          generate_release_notes: true
